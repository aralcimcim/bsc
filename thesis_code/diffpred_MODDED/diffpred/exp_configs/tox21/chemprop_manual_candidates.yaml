    feature_hiddens:
    - 128
- name: width_256
  hparams:
    feature_hiddens:
    - 256
- name: width_512
  hparams:
    feature_hiddens:
    - 512
- name: dropout_01
  hparams:
    dropout: 0.1
- name: dropout_02
  hparams:
    dropout: 0.2
- name: dropout_03
  hparams:
    dropout: 0.3
- name: readout_layers_1
