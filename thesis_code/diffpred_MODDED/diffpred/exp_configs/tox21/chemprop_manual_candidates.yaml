# Explicit manual experiments on DiffPred Chemprop; every entry inherits chemprop.yaml.
# No JKU model settings. Add combinations explicitly; this is not a Cartesian product.
candidates:
- name: reference
- name: depth_2
  hparams:
    chemprop_depth: 2
- name: depth_4
  hparams:
    chemprop_depth: 4
- name: depth_5
  hparams:
    chemprop_depth: 5
- name: width_128
